<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AutoStudio | AIテロップ動画ジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 0.75rem; padding: 1.5rem; }
        .input-ui { background: #010409; border: 1px solid #30363d; color: #c9d1d9; border-radius: 0.5rem; padding: 0.5rem; width: 100%; }
        .input-ui:focus { outline: none; border-color: #58a6ff; }
        input[type="color"] { padding: 0; height: 2.5rem; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen p-6 space-y-6 max-w-6xl mx-auto">
    <header class="border-b border-[#30363d] pb-4">
        <h1 class="text-3xl font-bold text-[#58a6ff]">AutoStudio <span class="text-sm font-normal text-gray-400">by YuJitsu</span></h1>
        <p class="text-[#8b949e] mt-2">AIで自動文字起こしを行い、動画にそのままスタイル付きテロップと音声を合成してMP4動画として書き出します。</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 左カラム：設定とAI実行 -->
        <div class="space-y-6 lg:col-span-1">
            
            <!-- ① デフォルトスタイル設定 -->
            <div class="panel">
                <h2 class="text-lg font-bold mb-4 text-[#79c0ff]">① デフォルト・テロップ設定</h2>
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block mb-1">フォント種類</label>
                        <select id="def-font" class="input-ui">
                            <option value="sans-serif">ゴシック体 (Sans-serif)</option>
                            <option value="serif">明朝体 (Serif)</option>
                            <option value="monospace">等幅フォント (Monospace)</option>
                            <option value="'Impact'">インパクト (Impact)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block mb-1">文字色</label><input type="color" id="def-color" value="#ffffff" class="input-ui"></div>
                        <div><label class="block mb-1">縁取り色</label><input type="color" id="def-stroke-color" value="#000000" class="input-ui"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block mb-1">縁取りの太さ</label><input type="number" id="def-stroke-width" value="6" class="input-ui" min="0" max="20"></div>
                        <div><label class="block mb-1">文字サイズ</label><input type="number" id="def-size" value="60" class="input-ui" min="10"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block mb-1">影・発光 (Blur)</label><input type="number" id="def-shadow-blur" value="10" class="input-ui" min="0"></div>
                        <div><label class="block mb-1">影の色</label><input type="color" id="def-shadow-color" value="#000000" class="input-ui"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block mb-1">表示位置 X (%)</label><input type="number" id="def-x" value="50" class="input-ui" min="0" max="100"></div>
                        <div><label class="block mb-1">表示位置 Y (%)</label><input type="number" id="def-y" value="88" class="input-ui" min="0" max="100"></div>
                    </div>
                    <div>
                        <label class="block mb-1">アニメーション</label>
                        <select id="def-anim" class="input-ui">
                            <option value="none">なし (パッと表示)</option>
                            <option value="fade">フェードイン</option>
                            <option value="slide-up">下からスライド</option>
                            <option value="typewriter">タイピング風 (1文字ずつ)</option>
                            <option value="zoom-in">ズームイン (拡大)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- ② ファイル読み込み & AI実行 -->
            <div class="panel">
                <h2 class="text-lg font-bold mb-4 text-[#79c0ff]">② AI文字起こし実行</h2>
                <input type="file" id="mediaInput" accept="video/*,audio/*" class="block w-full text-sm text-[#8b949e] file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-[#238636] file:text-white hover:file:bg-[#2ea043] cursor-pointer mb-4">
                
                <button id="startBtn" class="bg-[#238636] hover:bg-[#2ea043] text-white px-4 py-3 rounded-md font-bold w-full transition disabled:opacity-50">
                    解析してブロックを生成
                </button>

                <div id="aiStatus" class="mt-4 text-xs text-[#58a6ff] hidden font-mono whitespace-pre-wrap"></div>
            </div>

            <!-- ③ 書き出し -->
            <div class="panel">
                <h2 class="text-lg font-bold mb-4 text-[#79c0ff]">③ 合成動画の書き出し</h2>
                <p class="text-xs text-gray-400 mb-4">プレビューの映像にテロップと音声を合成し、1つの動画として保存します。</p>
                <button id="exportBtn" class="bg-[#8957e5] hover:bg-[#9d6cfa] text-white px-4 py-3 rounded-md font-bold w-full transition disabled:opacity-50" disabled>
                    MP4で書き出す
                </button>
            </div>
        </div>

        <!-- 右カラム：プレビューとブロックリスト -->
        <div class="lg:col-span-2 space-y-6 flex flex-col">
            
            <!-- プレビュー画面 -->
            <div class="panel flex-none relative">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold text-[#79c0ff]">プレビュー (合成結果)</h2>
                </div>
                
                <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden border border-[#30363d]">
                    <!-- 表示用と音声再生用の動画プレーヤー -->
                    <video id="mediaPlayer" class="absolute inset-0 w-full h-full object-contain hidden" crossorigin="anonymous"></video>
                    
                    <!-- 実際に動画とテロップを合成して描画するキャンバス -->
                    <canvas id="subtitleCanvas" class="absolute inset-0 w-full h-full object-contain"></canvas>
                </div>
                <!-- キャンバス下部に独自のコントロールUI（簡易版） -->
                <div class="flex items-center gap-2 mt-2 bg-[#010409] p-2 rounded">
                    <button id="playBtn" class="text-white px-3 py-1 bg-[#21262d] rounded hover:bg-[#30363d]">再生 / 一時停止</button>
                    <input type="range" id="seekSlider" class="flex-1" value="0" step="0.1" min="0">
                </div>
            </div>

            <!-- ブロックリスト -->
            <div class="panel flex-1 overflow-y-auto" style="max-height: 500px;">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-[#79c0ff]">テロップブロック一覧</h2>
                    <button id="addBlockBtn" class="text-xs bg-[#21262d] border border-[#30363d] px-3 py-1 rounded hover:bg-[#30363d]">＋ 新規ブロック追加</button>
                </div>
                <div id="blocksContainer" class="space-y-4">
                    <div class="text-sm text-gray-500 text-center py-10">AI解析を実行すると、ここにテロップブロックが生成されます。</div>
                </div>
            </div>

        </div>
    </div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.16.0';
    env.allowLocalModels = false;

    // --- State & Elements ---
    let blocks = [];
    let blockIdCounter = 0;
    let isExporting = false;
    let rafId = null;
    let audioCtxExport = null;
    let mediaSource = null;
    let mediaDest = null;

    const ui = {
        defFont: document.getElementById('def-font'),
        defColor: document.getElementById('def-color'),
        defStrokeColor: document.getElementById('def-stroke-color'),
        defStrokeWidth: document.getElementById('def-stroke-width'),
        defSize: document.getElementById('def-size'),
        defShadowBlur: document.getElementById('def-shadow-blur'),
        defShadowColor: document.getElementById('def-shadow-color'),
        defX: document.getElementById('def-x'),
        defY: document.getElementById('def-y'),
        defAnim: document.getElementById('def-anim'),
        
        mediaInput: document.getElementById('mediaInput'),
        startBtn: document.getElementById('startBtn'),
        aiStatus: document.getElementById('aiStatus'),
        exportBtn: document.getElementById('exportBtn'),
        
        mediaPlayer: document.getElementById('mediaPlayer'),
        canvas: document.getElementById('subtitleCanvas'),
        blocksContainer: document.getElementById('blocksContainer'),
        addBlockBtn: document.getElementById('addBlockBtn'),

        playBtn: document.getElementById('playBtn'),
        seekSlider: document.getElementById('seekSlider')
    };

    const ctx = ui.canvas.getContext('2d');
    ui.canvas.width = 1920; 
    ui.canvas.height = 1080;

    // --- Helper: Get Default Style ---
    function getDefaultStyle() {
        return {
            font: ui.defFont.value,
            color: ui.defColor.value,
            strokeColor: ui.defStrokeColor.value,
            strokeWidth: parseFloat(ui.defStrokeWidth.value),
            size: parseFloat(ui.defSize.value),
            shadowBlur: parseFloat(ui.defShadowBlur.value),
            shadowColor: ui.defShadowColor.value,
            x: parseFloat(ui.defX.value),
            y: parseFloat(ui.defY.value),
            anim: ui.defAnim.value
        };
    }

    // --- Media Input Handling ---
    let mediaUrl = null;
    ui.mediaInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        if(mediaUrl) URL.revokeObjectURL(mediaUrl);
        mediaUrl = URL.createObjectURL(file);
        ui.mediaPlayer.src = mediaUrl;
        
        // 動画の解像度に合わせてキャンバスサイズを変更
        ui.mediaPlayer.onloadedmetadata = () => {
            if(ui.mediaPlayer.videoWidth) {
                ui.canvas.width = ui.mediaPlayer.videoWidth;
                ui.canvas.height = ui.mediaPlayer.videoHeight;
            }
            ui.seekSlider.max = ui.mediaPlayer.duration;
            ui.exportBtn.disabled = false;
        };
    });

    // プレイヤーの簡易コントロール
    ui.playBtn.addEventListener('click', () => {
        if(ui.mediaPlayer.paused) ui.mediaPlayer.play();
        else ui.mediaPlayer.pause();
    });
    ui.mediaPlayer.addEventListener('timeupdate', () => {
        if(!isExporting) ui.seekSlider.value = ui.mediaPlayer.currentTime;
    });
    ui.seekSlider.addEventListener('input', (e) => {
        ui.mediaPlayer.currentTime = parseFloat(e.target.value);
    });

    // --- AI Transcription Logic ---
    ui.startBtn.addEventListener('click', async () => {
        if (!ui.mediaInput.files.length) { alert('ファイルを選択してください！'); return; }
        
        ui.startBtn.disabled = true;
        ui.aiStatus.classList.remove('hidden');
        ui.blocksContainer.innerHTML = '';
        blocks = [];
        
        try {
            ui.aiStatus.innerText = "⏳ AIモデルを準備中...";
            const transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny', {
                progress_callback: (info) => {
                    if (info.status === 'downloading') ui.aiStatus.innerText = `⏳ モデルダウンロード中... ${Math.round(info.progress||0)}%`;
                }
            });

            ui.aiStatus.innerText = "⏳ 音声データを抽出・変換中...";
            const file = ui.mediaInput.files[0];
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            const audioData = audioBuffer.getChannelData(0);

            ui.aiStatus.innerText = "✨ AI文字起こし・セクション分割を実行中...";
            const result = await transcriber(audioData, {
                chunk_length_s: 30, stride_length_s: 5, language: 'japanese', task: 'transcribe', return_timestamps: true
            });

            let chunks = result.chunks || [];
            let currentBlock = null;
            const defStyle = getDefaultStyle();

            for (let chunk of chunks) {
                if (!currentBlock) {
                    currentBlock = { id: blockIdCounter++, start: chunk.timestamp[0], end: chunk.timestamp[1], text: chunk.text.trim(), override: false, style: {...defStyle} };
                } else {
                    if (chunk.timestamp[0] - currentBlock.end >= 1.0) {
                        blocks.push(currentBlock);
                        currentBlock = { id: blockIdCounter++, start: chunk.timestamp[0], end: chunk.timestamp[1], text: chunk.text.trim(), override: false, style: {...defStyle} };
                    } else {
                        currentBlock.end = chunk.timestamp[1];
                        currentBlock.text += " " + chunk.text.trim();
                    }
                }
            }
            if (currentBlock) blocks.push(currentBlock);

            ui.aiStatus.innerText = "✅ 解析完了！ブロックを生成しました。";
            setTimeout(() => ui.aiStatus.classList.add('hidden'), 3000);
            renderBlocksUI();
            
        } catch (e) {
            ui.aiStatus.innerText = "❌ エラー: " + e.message;
            console.error(e);
        } finally {
            ui.startBtn.disabled = false;
        }
    });

    // --- Block UI Rendering ---
    function renderBlocksUI() {
        ui.blocksContainer.innerHTML = '';
        blocks.forEach((block, index) => {
            const el = document.createElement('div');
            el.className = "bg-[#010409] border border-[#30363d] rounded-lg p-3";
            el.innerHTML = `
                <div class="flex gap-2 items-center mb-2">
                    <span class="text-xs bg-[#238636] px-2 py-1 rounded text-white font-bold">#${index+1}</span>
                    <input type="number" step="0.1" class="input-ui !py-1 w-20 text-xs" value="${block.start.toFixed(2)}" onchange="updateBlock(${block.id}, 'start', this.value)">
                    <span class="text-gray-500 text-xs">〜</span>
                    <input type="number" step="0.1" class="input-ui !py-1 w-20 text-xs" value="${block.end.toFixed(2)}" onchange="updateBlock(${block.id}, 'end', this.value)">
                    <button class="text-xs bg-[#30363d] px-2 py-1 rounded ml-2" onclick="seekTo(${block.start})">▶ ここから再生</button>
                    <div class="ml-auto text-xs flex items-center gap-2">
                        <label class="flex items-center gap-1 cursor-pointer text-[#79c0ff]">
                            <input type="checkbox" ${block.override ? 'checked' : ''} onchange="toggleOverride(${block.id}, this.checked)"> 個別スタイル
                        </label>
                        <button class="text-red-400 hover:text-red-300 ml-2" onclick="deleteBlock(${block.id})">削除</button>
                    </div>
                </div>
                <textarea class="input-ui w-full h-12 text-sm" onchange="updateBlock(${block.id}, 'text', this.value)">${block.text}</textarea>
                
                <div id="style-panel-${block.id}" class="mt-3 p-3 bg-[#161b22] rounded border border-[#30363d] text-xs ${block.override ? 'block' : 'hidden'}">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div><label class="block mb-1">フォント</label><select class="input-ui !py-1" onchange="updateStyle(${block.id}, 'font', this.value)">
                            <option value="sans-serif" ${block.style.font==='sans-serif'?'selected':''}>ゴシック</option>
                            <option value="serif" ${block.style.font==='serif'?'selected':''}>明朝体</option>
                        </select></div>
                        <div><label class="block mb-1">色</label><input type="color" class="input-ui h-6" value="${block.style.color}" onchange="updateStyle(${block.id}, 'color', this.value)"></div>
                        <div><label class="block mb-1">縁色</label><input type="color" class="input-ui h-6" value="${block.style.strokeColor}" onchange="updateStyle(${block.id}, 'strokeColor', this.value)"></div>
                        <div><label class="block mb-1">縁太さ</label><input type="number" class="input-ui !py-1" value="${block.style.strokeWidth}" onchange="updateStyle(${block.id}, 'strokeWidth', this.value)"></div>
                        <div><label class="block mb-1">サイズ</label><input type="number" class="input-ui !py-1" value="${block.style.size}" onchange="updateStyle(${block.id}, 'size', this.value)"></div>
                        <div><label class="block mb-1">アニメ</label><select class="input-ui !py-1" onchange="updateStyle(${block.id}, 'anim', this.value)">
                            <option value="none" ${block.style.anim==='none'?'selected':''}>なし</option><option value="fade" ${block.style.anim==='fade'?'selected':''}>フェード</option>
                            <option value="slide-up" ${block.style.anim==='slide-up'?'selected':''}>スライド</option><option value="typewriter" ${block.style.anim==='typewriter'?'selected':''}>タイピング</option>
                            <option value="zoom-in" ${block.style.anim==='zoom-in'?'selected':''}>ズーム</option>
                        </select></div>
                        <div><label class="block mb-1">X(%)</label><input type="number" class="input-ui !py-1" value="${block.style.x}" onchange="updateStyle(${block.id}, 'x', this.value)"></div>
                        <div><label class="block mb-1">Y(%)</label><input type="number" class="input-ui !py-1" value="${block.style.y}" onchange="updateStyle(${block.id}, 'y', this.value)"></div>
                    </div>
                </div>
            `;
            ui.blocksContainer.appendChild(el);
        });
    }

    // Global UI events
    window.updateBlock = (id, key, val) => { const b = blocks.find(x => x.id === id); if(b) b[key] = (key === 'start' || key === 'end') ? parseFloat(val) : val; };
    window.updateStyle = (id, key, val) => { const b = blocks.find(x => x.id === id); if(b) b.style[key] = (key === 'size' || key === 'strokeWidth' || key === 'x' || key === 'y') ? parseFloat(val) : val; };
    window.toggleOverride = (id, checked) => {
        const b = blocks.find(x => x.id === id);
        if(b) {
            b.override = checked;
            if(checked) b.style = {...getDefaultStyle()};
            document.getElementById(`style-panel-${id}`).style.display = checked ? 'block' : 'none';
            renderBlocksUI();
        }
    };
    window.deleteBlock = (id) => { blocks = blocks.filter(x => x.id !== id); renderBlocksUI(); };
    window.seekTo = (time) => { ui.mediaPlayer.currentTime = time; ui.mediaPlayer.play(); };

    ui.addBlockBtn.addEventListener('click', () => {
        const lastEnd = blocks.length > 0 ? blocks[blocks.length-1].end : 0;
        blocks.push({ id: blockIdCounter++, start: lastEnd + 0.5, end: lastEnd + 3.5, text: "新規テロップ", override: false, style: {...getDefaultStyle()} });
        renderBlocksUI();
    });

    // --- Canvas Rendering Loop ---
    function drawCanvas() {
        ctx.clearRect(0, 0, ui.canvas.width, ui.canvas.height);
        
        // 1. 元の動画を描画 (映像データがある場合のみ)
        if (ui.mediaPlayer.readyState >= 2) {
            ctx.drawImage(ui.mediaPlayer, 0, 0, ui.canvas.width, ui.canvas.height);
        }

        const t = ui.mediaPlayer.currentTime;
        const activeBlock = blocks.find(b => t >= b.start && t <= b.end);
        
        // 2. その上にテロップを描画
        if (activeBlock) {
            const style = activeBlock.override ? activeBlock.style : getDefaultStyle();
            const timeIn = t - activeBlock.start;
            const duration = activeBlock.end - activeBlock.start;
            
            ctx.save();
            let alpha = 1.0; let yOffset = 0; let scale = 1.0; let textToDraw = activeBlock.text;

            if (style.anim === 'fade') { alpha = Math.min(1, timeIn * 3); }
            else if (style.anim === 'slide-up') { alpha = Math.min(1, timeIn * 3); yOffset = (1 - alpha) * 40; }
            else if (style.anim === 'typewriter') { const charCount = Math.floor(timeIn * 15); textToDraw = textToDraw.substring(0, Math.min(textToDraw.length, charCount)); }
            else if (style.anim === 'zoom-in') { alpha = Math.min(1, timeIn * 3); scale = 0.8 + (0.2 * Math.min(1, timeIn * 4)); }

            ctx.globalAlpha = alpha;
            ctx.font = `900 ${style.size}px ${style.font}`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            
            const baseX = (style.x / 100) * ui.canvas.width;
            const baseY = (style.y / 100) * ui.canvas.height + yOffset;

            if (scale !== 1.0) { ctx.translate(baseX, baseY); ctx.scale(scale, scale); ctx.translate(-baseX, -baseY); }

            ctx.fillStyle = style.color;
            ctx.strokeStyle = style.strokeColor;
            ctx.lineWidth = style.strokeWidth;
            ctx.lineJoin = 'round';

            if (style.shadowBlur > 0) { ctx.shadowColor = style.shadowColor; ctx.shadowBlur = style.shadowBlur; }

            const lines = textToDraw.split('\n');
            const lineHeight = style.size * 1.3;
            const startY = baseY - ((lines.length - 1) * lineHeight) / 2;

            for (let i = 0; i < lines.length; i++) {
                const y = startY + (i * lineHeight);
                if(style.strokeWidth > 0) ctx.strokeText(lines[i], baseX, y);
                ctx.shadowBlur = 0;
                ctx.fillText(lines[i], baseX, y);
            }
            ctx.restore();
        }
        rafId = requestAnimationFrame(drawCanvas);
    }
    drawCanvas(); // ループ開始

    // --- MP4 Video & Audio Export ---
    ui.exportBtn.addEventListener('click', async () => {
        if(isExporting) return;
        if(!window.MediaRecorder || !ui.canvas.captureStream) { alert('お使いのブラウザは書き出しに対応していません。'); return; }
        if(!ui.mediaPlayer.src) return;

        isExporting = true;
        ui.exportBtn.innerText = "書き出し中... (動画再生を止めないでください)";
        ui.exportBtn.classList.replace('bg-[#8957e5]', 'bg-gray-600');
        
        // --- ストリームの合成（映像＋音声）---
        const canvasStream = ui.canvas.captureStream(30); // 映像(30FPS)
        let audioStream = new MediaStream();

        try {
            // Web Audio API を使って動画の音声をキャプチャする（安全・確実な方法）
            if(!audioCtxExport) {
                audioCtxExport = new (window.AudioContext || window.webkitAudioContext)();
                mediaSource = audioCtxExport.createMediaElementSource(ui.mediaPlayer);
                mediaDest = audioCtxExport.createMediaStreamDestination();
                mediaSource.connect(mediaDest);
                mediaSource.connect(audioCtxExport.destination); // プレビュー中も音を出す
            }
            audioStream = mediaDest.stream;
        } catch(e) {
            // エラー時のフォールバック (Firefox等の captureStream)
            console.warn("Audio Context capture failed, using fallback.", e);
            if (ui.mediaPlayer.captureStream) audioStream = ui.mediaPlayer.captureStream();
            else if (ui.mediaPlayer.mozCaptureStream) audioStream = ui.mediaPlayer.mozCaptureStream();
        }

        // 映像と音声を1つのストリームにガッチャンコ
        const combinedStream = new MediaStream([
            ...canvasStream.getVideoTracks(),
            ...audioStream.getAudioTracks()
        ]);

        // Chrome等でMP4がサポートされていればMP4、ダメならWebMで出力
        const mimeOptions = ['video/mp4;codecs=h264,aac', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
        const mime = mimeOptions.find(m => MediaRecorder.isTypeSupported(m)) || '';
        const ext = mime.includes('mp4') ? 'mp4' : 'webm';
        
        const rec = new MediaRecorder(combinedStream, mime ? { mimeType: mime } : undefined);
        const chunks = [];
        
        rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
            const blob = new Blob(chunks, { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `autostudio_export.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
            
            isExporting = false;
            ui.exportBtn.innerText = "MP4で書き出す";
            ui.exportBtn.classList.replace('bg-gray-600', 'bg-[#8957e5]');
            ui.mediaPlayer.pause();
        };

        // 録画のために動画を最初から再生
        ui.mediaPlayer.currentTime = 0;
        await ui.mediaPlayer.play();
        rec.start(250);

        // 動画が最後まで再生されたら録画を終了
        ui.mediaPlayer.onended = () => {
            if(rec.state !== 'inactive') rec.stop();
        };
    });

</script>
</body>
</html>
