<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YuJitsu Studio - AutoStudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; user-select: none; }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 0.5rem; }
        .input-ui { background: #010409; border: 1px solid #30363d; color: #c9d1d9; border-radius: 0.25rem; padding: 0.5rem; width: 100%; font-size: 0.875rem;}
        .input-ui:focus { outline: none; border-color: #58a6ff; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #010409; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #58a6ff; }
    </style>
</head>
<body class="h-screen flex flex-col p-4 gap-4 overflow-hidden">

    <header class="panel flex items-center justify-between px-6 py-3 flex-none border-b-2 border-b-[#79c0ff]">
        <div class="flex items-center gap-3">
            <div class="bg-[#79c0ff] text-black font-extrabold px-3 py-1 rounded-lg text-xl">A</div>
            <h1 class="text-xl font-bold text-white">AutoStudio <span class="text-xs font-normal text-[#79c0ff] ml-2 border border-[#79c0ff] px-2 py-0.5 rounded">自動台本＆テロップ生成</span></h1>
        </div>
    </header>

    <div class="flex flex-1 gap-4 min-h-0">
        
        <!-- 左側：台本入力＆一括生成エリア -->
        <div class="panel w-1/3 flex flex-col p-4 gap-3">
            <h2 class="text-sm font-bold text-gray-400 border-b border-[#30363d] pb-2">📝 台本一括入力</h2>
            <p class="text-xs text-gray-500">ここに長文を入力すると、句読点（。！？）や改行ごとに自動でテロップブロックに分解されます。</p>
            
            <textarea id="scriptInput" class="input-ui flex-1 resize-none p-3 font-mono text-sm" placeholder="皆さんこんにちは。ゆっくり魔理沙だぜ。今日はプライムシューターをスペースシューターでボコしていくよ"></textarea>
            
            <button id="generateBtn" class="w-full bg-[#238636] hover:bg-[#2ea043] text-white font-extrabold py-2.5 rounded text-sm transition">
                ⚡ 台本からテロップを一括生成
            </button>
        </div>

        <!-- 右側：プレビュー＆テロップブロック一覧 -->
        <div class="panel flex-1 flex flex-col p-4 gap-4 min-h-0">
            <!-- プレビュー表示 -->
            <div class="bg-black rounded border border-[#30363d] h-48 relative flex items-center justify-center overflow-hidden flex-none">
                <div id="previewBox" class="text-2xl font-black text-yellow-300 drop-shadow-[0_2px_2px_rgba(0,0,0,1)] text-center px-4">
                    プレビュー画面
                </div>
            </div>

            <!-- ブロック一覧エリア -->
            <div class="flex items-center justify-between border-b border-[#30363d] pb-2 flex-none">
                <h2 class="text-sm font-bold text-gray-400">テロップブロック一覧</h2>
                <button id="addBlockBtn" class="bg-[#21262d] border border-[#30363d] hover:bg-[#30363d] text-xs px-3 py-1 rounded text-gray-300">+ 新規ブロック</button>
            </div>

            <div id="blocksContainer" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- ここにテロップブロックが追加されます -->
            </div>
        </div>
    </div>

<script>
    let blocks = [];

    const scriptInput = document.getElementById('scriptInput');
    const generateBtn = document.getElementById('generateBtn');
    const blocksContainer = document.getElementById('blocksContainer');
    const addBlockBtn = document.getElementById('addBlockBtn');
    const previewBox = document.getElementById('previewBox');

    // 台本一括解析＆生成（修正版ロジック）
    generateBtn.addEventListener('click', () => {
        const rawText = scriptInput.value.trim();
        if (!rawText) return alert("台本テキストを入力してください");

        // 句読点（。！？）および改行で正しく分割（末尾の記号を保持）
        const sentences = rawText.split(/(?<=[。！？\n])/g)
            .map(s => s.trim())
            .filter(s => s.length > 0);

        blocks = [];
        let currentTime = 0;

        sentences.forEach((text, index) => {
            // 文字数に応じた表示時間計算（最低2秒）
            const duration = Math.max(2.0, Math.round(text.length * 0.15 * 100) / 100);
            blocks.push({
                id: Date.now() + index,
                start: currentTime,
                end: Math.round((currentTime + duration) * 100) / 100,
                text: text
            });
            currentTime = Math.round((currentTime + duration) * 100) / 100;
        });

        renderBlocks();
    });

    // ブロック一覧描画
    function renderBlocks() {
        blocksContainer.innerHTML = '';
        
        if (blocks.length === 0) {
            blocksContainer.innerHTML = `<div class="text-center text-xs text-gray-600 py-8">ブロックがありません。左側から生成してください。</div>`;
            return;
        }

        blocks.forEach((block, idx) => {
            const card = document.createElement('div');
            card.className = 'bg-[#010409] p-3 rounded border border-[#30363d] space-y-2';
            
            card.innerHTML = `
                <div class="flex items-center justify-between text-xs">
                    <span class="bg-[#238636] text-white font-bold px-2 py-0.5 rounded">#${idx + 1}</span>
                    <div class="flex items-center gap-2">
                        <input type="number" step="0.1" value="${block.start}" class="input-ui !w-16 !p-1 text-center start-val">
                        <span class="text-gray-500">~</span>
                        <input type="number" step="0.1" value="${block.end}" class="input-ui !w-16 !p-1 text-center end-val">
                        <button class="delete-btn text-red-400 hover:text-red-300 ml-2">削除</button>
                    </div>
                </div>
                <textarea class="input-ui resize-y text-sm text-white font-bold text-area h-16">${block.text}</textarea>
            `;

            // イベント登録
            const textArea = card.querySelector('.text-area');
            textArea.addEventListener('input', (e) => {
                block.text = e.target.value;
                previewBox.innerText = block.text;
            });
            textArea.addEventListener('focus', () => {
                previewBox.innerText = block.text;
            });

            card.querySelector('.start-val').addEventListener('change', (e) => block.start = parseFloat(e.target.value) || 0);
            card.querySelector('.end-val').addEventListener('change', (e) => block.end = parseFloat(e.target.value) || 0);
            card.querySelector('.delete-btn').addEventListener('click', () => {
                blocks = blocks.filter(b => b.id !== block.id);
                renderBlocks();
            });

            blocksContainer.appendChild(card);
        });

        if (blocks.length > 0) previewBox.innerText = blocks[0].text;
    }

    // 単体追加
    addBlockBtn.addEventListener('click', () => {
        const lastEnd = blocks.length > 0 ? blocks[blocks.length - 1].end : 0;
        blocks.push({
            id: Date.now(),
            start: lastEnd,
            end: lastEnd + 2.0,
            text: '新規テキスト'
        });
        renderBlocks();
    });
</script>
</body>
</html>
