<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuJitsu Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .tab-btn.active {
            border-bottom: 2px solid #f78166;
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- ナビゲーションバー -->
    <header class="bg-[#161b22] border-b border-[#30363d] px-6 py-3 flex items-center justify-between flex-none">
        <div class="flex items-center space-x-3">
            <div class="bg-[#8957e5] text-white font-extrabold px-3 py-1 rounded-lg text-lg">Y</div>
            <h1 class="text-xl font-bold text-white tracking-wide">YuJitsu Studio</h1>
        </div>
        
<!-- タブ切り替えボタン -->
        <nav class="flex space-x-6 text-sm text-gray-400">
            <button onclick="switchTab('clipforge')" id="tab-clipforge" class="tab-btn py-2 px-1 hover:text-white transition flex items-center gap-1">
                <span>📋</span> ClipForge
            </button>
            <button onclick="switchTab('moddel-one')" id="tab-moddel-one" class="tab-btn py-2 px-1 hover:text-white transition flex items-center gap-1">
                <span>🎤</span> Moddel-one
            </button>
            <button onclick="switchTab('autostudio')" id="tab-autostudio" class="tab-btn active py-2 px-1 hover:text-white transition flex items-center gap-1">
                <span>📺</span> AutoStudio
            </button>
            <button onclick="switchTab('clipcutter')" id="tab-clipcutter" class="tab-btn py-2 px-1 hover:text-white transition flex items-center gap-1">
                <span>✂️</span> ClipCutter
            </button>
        </nav>
    </header>

    <!-- iframe表示エリア -->
    <main class="flex-1 bg-[#0d1117] relative">
        <iframe id="app-frame" src="AutoStudio.html" class="w-full h-full border-none"></iframe>
    </main>

    <script>
const routes = {
            'clipforge': 'ClipForge.html',
            'modelone': 'Moddel-one.html', // (※前回直していただいた部分)
            'autostudio': 'AutoStudio.html',
            'clipcutter': 'ClipCutter.html' // ◀★これを追加！
        };
        function switchTab(tabName) {
            // タブの見た目を切り替え
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            // iframeの読み込み先を変更
            const frame = document.getElementById('app-frame');
            if (routes[tabName]) {
                frame.src = routes[tabName];
            }
        }
    </script>
</body>
</html>
