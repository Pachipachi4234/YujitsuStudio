<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YuJitsu Studio - Master Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AIトラッキング用 (Transformers.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.16.0"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; user-select: none; }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 0.5rem; }
        .input-ui { background: #010409; border: 1px solid #30363d; color: #c9d1d9; border-radius: 0.25rem; padding: 0.25rem 0.5rem; width: 100%; font-size: 0.875rem;}
        .input-ui:focus { outline: none; border-color: #58a6ff; }
        
        .timeline-track { position: relative; height: 44px; background: rgba(1, 4, 9, 0.5); border-bottom: 1px solid #30363d; border-radius: 4px; overflow: hidden; cursor: pointer; }
        .timeline-item { position: absolute; height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 12px; font-weight: bold; color: white; cursor: grab; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none;}
        .timeline-item:active { cursor: grabbing; }
        
        .resize-handle-l { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 20; }
        .resize-handle-r { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 20; }
        
        .track-video { background: #238636; } .track-pip { background: #8957e5; } .track-text { background: #79c0ff; color: #000; } .track-audio { background: #d29922; }
        .item-selected { box-shadow: 0 0 0 2px #58a6ff, inset 0 0 0 1px rgba(0,0,0,0.8) !important; z-index: 10; }
        
        .kf-marker { position: absolute; top: 0; bottom: 0; width: 8px; background: rgba(255,255,255,0.8); border-left: 1px solid #000; border-right: 1px solid #000; transform: skewX(-20deg); pointer-events: none;}
        
        #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff0000; z-index: 50; pointer-events: none; }
        #playheadHandle { position: absolute; top: -10px; left: -7px; width: 16px; height: 16px; background: #ff0000; border: 2px solid white; border-radius: 50%; cursor: grab; z-index: 60; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
        #playheadHandle:active { cursor: grabbing; scale: 1.2; }

        ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: #010409; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: #58a6ff; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden p-2 gap-2">

    <header class="panel flex items-center justify-between px-4 py-2 flex-none border-b-2 border-b-[#58a6ff]">
        <div class="flex items-center gap-4">
            <div class="bg-[#58a6ff] text-black font-extrabold px-3 py-1 rounded-lg text-lg">Y</div>
            <h1 class="text-xl font-bold text-white">YuJitsu Studio <span class="text-xs font-normal text-[#58a6ff] ml-2 border border-[#58a6ff] px-2 py-0.5 rounded">Master Editor</span></h1>
        </div>
        <div class="flex items-center gap-2">
            <div id="statusMsg" class="text-xs text-[#58a6ff] font-mono mr-4 hidden">処理中...</div>
            <button id="exportBtn" class="bg-[#58a6ff] hover:bg-[#79c0ff] text-black px-6 py-1.5 rounded text-sm font-extrabold transition">🎬 統合MP4書き出し</button>
        </div>
    </header>

    <div class="flex flex-1 gap-2 min-h-0">
        <div class="panel flex-1 flex flex-col p-2 relative">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-bold text-gray-400">プレビュー</h2>
                <div class="text-xs font-mono bg-black px-2 py-1 rounded text-[#58a6ff]" id="timeDisplay">00:00.0 / 00:00.0</div>
            </div>
            <div class="flex-1 bg-black rounded overflow-hidden relative flex items-center justify-center border border-[#30363d]">
                <canvas id="previewCanvas" class="max-w-full max-h-full cursor-move"></canvas>
            </div>
            <div class="flex items-center gap-2 mt-2">
                <button id="playBtn" class="bg-[#238636] hover:bg-[#2ea043] text-white px-4 py-1 rounded font-bold w-24">再生</button>
                <input type="range" id="seekSlider" class="flex-1 cursor-pointer" value="0" step="0.01" min="0">
                <button id="addTimeBtn" class="bg-[#21262d] text-xs px-2 py-1 rounded hover:bg-[#30363d] border border-[#30363d]">+5秒</button>
            </div>
        </div>

        <div class="panel w-80 flex flex-col p-4 overflow-y-auto">
            <h2 class="text-sm font-bold text-gray-400 mb-2 border-b border-[#30363d] pb-2">➕ 素材追加</h2>
            <div class="space-y-2 mb-4">
                <input type="file" id="mediaUpload" accept="video/*,audio/*" class="hidden">
                <input type="file" id="pipUpload" accept="image/*,video/*" class="hidden">
                <button onclick="document.getElementById('mediaUpload').click()" class="w-full bg-[#21262d] border border-[#30363d] hover:bg-[#30363d] py-1.5 rounded text-xs text-gray-300">📁 映像 / 音声</button>
                <button onclick="document.getElementById('pipUpload').click()" class="w-full bg-[#21262d] border border-[#30363d] hover:bg-[#30363d] py-1.5 rounded text-xs text-gray-300">🖼 PiP (画像/小窓)</button>
                <button id="addTextBtn" class="w-full bg-[#21262d] border border-[#30363d] hover:bg-[#30363d] py-1.5 rounded text-xs font-bold text-[#79c0ff]">📝 テキスト</button>
            </div>

            <h2 class="text-sm font-bold text-gray-400 mb-2 border-b border-[#30363d] pb-2">⚙️ 選択アイテムの設定</h2>
            <div id="propertiesPanel" class="text-xs space-y-2 opacity-50 pointer-events-none transition-opacity">
                <button id="detachAudioBtn" class="hidden w-full mb-2 bg-[#d29922]/20 hover:bg-[#d29922]/40 text-[#e3b341] border border-[#d29922]/50 py-1.5 rounded font-bold transition">🎵 動画から音声を分離</button>

                <!-- ★ AI自動トラッキング発動ボタン -->
                <button id="aiTrackBtn" class="hidden w-full mb-2 bg-[#8957e5]/20 hover:bg-[#8957e5]/40 text-[#d2a8ff] border border-[#8957e5]/50 py-1.5 rounded font-bold transition">🎯 AI自動追従（トラッキング）</button>

                <div id="chromaArea" class="bg-[#010409] p-2 rounded border border-[#30363d] space-y-2 hidden">
                    <div class="flex items-center justify-between">
                        <label class="font-bold text-[#3fb950] flex items-center gap-1">🎨 クロマキー透過</label>
                        <input type="checkbox" id="propChromaEnable" class="cursor-pointer">
                    </div>
                    <div id="chromaControls" class="space-y-2 hidden pt-1 border-t border-[#30363d]">
                        <div class="flex items-center justify-between">
                            <span class="text-gray-400">くり抜く色:</span>
                            <input type="color" id="propChromaColor" value="#00ff00" class="input-ui !h-7 !w-16 !p-0 cursor-pointer">
                        </div>
                        <div>
                            <div class="flex justify-between text-[10px] text-gray-400 mb-1">
                                <span>色抜き感度</span>
                                <span id="chromaVal">100</span>
                            </div>
                            <input type="range" id="propChromaTol" min="10" max="250" value="100" class="w-full cursor-pointer">
                        </div>
                    </div>
                </div>

                <div id="propTextArea" class="hidden">
                    <textarea id="propText" class="input-ui h-12"></textarea>
                    <div class="flex gap-2 mt-1">
                        <input type="color" id="propColor" class="input-ui h-6 p-0 w-1/2">
                        <input type="number" id="propSize" class="input-ui w-1/2" placeholder="サイズ">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 bg-[#010409] p-2 rounded border border-[#30363d]">
                    <div><label class="block mb-1 text-gray-500">開始(秒)</label><input type="number" id="propStart" class="input-ui" step="0.1"></div>
                    <div><label class="block mb-1 text-gray-500">長さ(秒)</label><input type="number" id="propDuration" class="input-ui" step="0.1"></div>
                    <div class="col-span-2 mt-1">
                        <label class="block mb-1 text-[#79c0ff]">✨ 登場アニメーション</label>
                        <select id="propAnim" class="input-ui !py-1 text-xs">
                            <option value="none">なし</option>
                            <option value="fade">フェードイン</option>
                            <option value="slide-up">下からスライド</option>
                            <option value="zoom-in">ズームイン</option>
                        </select>
                    </div>
                </div>

                <div class="bg-[#010409] p-2 rounded border border-[#30363d] space-y-2">
                    <div class="flex justify-between items-center text-gray-500 mb-1">
                        <span>キーフレーム座標</span>
                        <button id="addKfBtn" class="bg-[#58a6ff] text-black px-2 py-0.5 rounded font-bold text-[10px] hover:bg-[#79c0ff]">🔷 現在位置に打鍵</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block mb-1">X</label><input type="number" id="propX" class="input-ui"></div>
                        <div><label class="block mb-1">Y</label><input type="number" id="propY" class="input-ui"></div>
                        <div><label class="block mb-1">スケール</label><input type="number" id="propScale" class="input-ui" step="0.1" value="1.0"></div>
                        <div><label class="block mb-1">透明度</label><input type="number" id="propOpacity" class="input-ui" step="0.1" value="1.0"></div>
                    </div>
                </div>

                <button id="deleteItemBtn" class="w-full mt-2 bg-red-900/50 hover:bg-red-800 text-red-300 py-1.5 rounded border border-red-800/50 font-bold">🗑 選択アイテムを削除</button>
            </div>
        </div>
    </div>

    <div class="panel h-64 flex flex-col flex-none p-2 relative">
        <div class="flex justify-between items-center text-xs text-gray-400 mb-2">
            <div class="flex items-center gap-4">
                <span class="font-bold text-white">タイムライン</span>
                <button id="splitBtn" class="bg-[#21262d] border border-[#30363d] hover:bg-[#30363d] px-3 py-1 rounded text-white flex items-center gap-1"><span class="text-[10px]">✂️</span> 分割 (Sキー)</button>
            </div>
            <div class="flex items-center gap-2">
                <span>🔍 ズーム</span>
                <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" class="w-24 cursor-pointer">
            </div>
        </div>
        
        <div class="flex-1 overflow-auto bg-[#010409] border border-[#30363d] rounded relative" id="tlWrapper">
            <div id="tlContent" class="relative flex flex-col" style="width: 100%; min-width: 100%;">
                <div class="flex relative h-6 border-b border-[#30363d] cursor-pointer" id="tlRuler">
                    <div class="w-20 flex-none sticky left-0 z-30 bg-[#010409] border-r border-[#30363d]"></div>
                    <div class="flex-1 relative" id="rulerTicks"></div>
                </div>
                
                <div class="relative flex" style="min-height: 180px;">
                    <div class="sticky left-0 w-20 flex-none bg-[#010409] z-20 flex flex-col gap-1 border-r border-[#30363d] pt-1">
                        <div class="h-[44px] flex items-center text-[10px] text-gray-400 pl-2">🎥 映像</div>
                        <div class="h-[44px] flex items-center text-[10px] text-gray-400 pl-2">🖼 PiP</div>
                        <div class="h-[44px] flex items-center text-[10px] text-gray-400 pl-2">📝 文字</div>
                        <div class="h-[44px] flex items-center text-[10px] text-gray-400 pl-2">🎵 音声</div>
                    </div>
                    
                    <div class="flex-1 flex flex-col gap-1 relative pt-1" id="tlTracks">
                        <div class="timeline-track" id="track-video"></div>
                        <div class="timeline-track" id="track-pip"></div>
                        <div class="timeline-track" id="track-text"></div>
                        <div class="timeline-track" id="track-audio"></div>
                        
                        <div id="playhead">
                            <div id="playheadHandle"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- AIトラッキング用ダイアログ -->
    <div id="aiModal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
        <div class="panel p-6 w-96 space-y-4 border border-[#8957e5]">
            <h3 class="font-bold text-lg text-white flex items-center gap-2">🎯 AI自動トラッキング設定</h3>
            <p class="text-xs text-gray-400">動画内のオブジェクトをAIが毎フレーム自動追跡し、キーフレームを自動生成します。</p>
            
            <div class="space-y-2">
                <label class="text-xs text-gray-300 block">追跡対象カテゴリ</label>
                <select id="aiTargetCategory" class="input-ui">
                    <option value="person">👤 人物・顔</option>
                    <option value="all">🔍 自動ターゲット（最も大きい物体）</option>
                </select>
            </div>

            <div id="aiProgressArea" class="hidden space-y-1 pt-2">
                <div class="flex justify-between text-xs text-[#d2a8ff]" id="aiStatusText">AIモデルロード中...</div>
                <div class="w-full bg-[#010409] rounded-full h-2 overflow-hidden border border-[#30363d]">
                    <div id="aiProgressBar" class="bg-[#8957e5] h-full w-0 transition-all"></div>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button id="closeAiModalBtn" class="bg-[#21262d] text-xs px-4 py-2 rounded hover:bg-[#30363d]">キャンセル</button>
                <button id="startAiTrackBtn" class="bg-[#8957e5] hover:bg-[#a475f9] text-white font-bold text-xs px-4 py-2 rounded">🚀 AIトラッキング解析開始</button>
            </div>
        </div>
    </div>

    <canvas id="offscreenCanvas" class="hidden"></canvas>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.16.0';
    env.allowLocalModels = false;

    const project = { duration: 30, items: [] };
    let currentTime = 0; let isPlaying = false; let selectedItemId = null;
    let lastTimeUpdate = 0; let isExporting = false;
    let detectorPipeline = null;

    const canvas = document.getElementById('previewCanvas'); const ctx = canvas.getContext('2d');
    canvas.width = 1920; canvas.height = 1080;
    
    const offCanvas = document.getElementById('offscreenCanvas');
    const offCtx = offCanvas.getContext('2d');

    const ui = {
        playBtn: document.getElementById('playBtn'), seekSlider: document.getElementById('seekSlider'),
        timeDisplay: document.getElementById('timeDisplay'), playhead: document.getElementById('playhead'),
        playheadHandle: document.getElementById('playheadHandle'),
        propsPanel: document.getElementById('propertiesPanel'), statusMsg: document.getElementById('statusMsg'),
        tlContent: document.getElementById('tlContent'), tlTracks: document.getElementById('tlTracks'),
        zoomSlider: document.getElementById('zoomSlider')
    };

    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

    function hexToRgb(hex) {
        const c = hex.replace('#', '');
        return [parseInt(c.substring(0, 2), 16), parseInt(c.substring(2, 4), 16), parseInt(c.substring(4, 6), 16)];
    }

    function addItem(type, src, fileObj, forceDuration = 5) {
        const item = {
            id: generateId(), type: type, src: src, start: currentTime, duration: forceDuration, 
            text: type === 'text' ? '新規テキスト' : '', color: '#ffffff', size: 100, el: null,
            anim: 'none', muted: false,
            chroma: false, chromaColor: '#00ff00', chromaTol: 100,
            keyframes: [{ time: 0, x: 960, y: 540, scale: 1.0, opacity: 1.0 }] 
        };

        if (type === 'video' || type === 'audio' || type === 'pip') {
            const isImage = fileObj && fileObj.type.startsWith('image');
            const el = document.createElement(isImage ? 'img' : (type === 'audio' ? 'audio' : 'video'));
            el.src = src; el.crossOrigin = "anonymous";
            if (isImage) { el.onload = () => updateTimeline(); } 
            else {
                el.onloadedmetadata = () => {
                    item.duration = el.duration;
                    if(type === 'video' && item.start + item.duration > project.duration) project.duration = item.start + item.duration;
                    updateTimeline();
                };
            }
            item.el = el;
        }
        project.items.push(item); selectItem(item.id); updateTimeline();
    }

    document.getElementById('detachAudioBtn').addEventListener('click', () => {
        if(!selectedItemId) return;
        const videoItem = project.items.find(i => i.id === selectedItemId);
        if(videoItem.type !== 'video' || !videoItem.el) return;

        videoItem.muted = true; videoItem.el.muted = true;
        const audioItem = JSON.parse(JSON.stringify(videoItem));
        audioItem.id = generateId(); audioItem.type = 'audio'; audioItem.muted = false;

        const audioEl = document.createElement('audio');
        audioEl.src = videoItem.src; audioEl.crossOrigin = "anonymous"; audioItem.el = audioEl;

        project.items.push(audioItem); selectItem(audioItem.id); updateTimeline();
        ui.statusMsg.innerText = "🎵 音声を分離しました";
        ui.statusMsg.classList.remove('hidden'); setTimeout(() => ui.statusMsg.classList.add('hidden'), 1500);
    });

    // --- 🎯 AI自動トラッキング機能 ---
    const aiModal = document.getElementById('aiModal');
    document.getElementById('aiTrackBtn').addEventListener('click', () => aiModal.classList.remove('hidden'));
    document.getElementById('closeAiModalBtn').addEventListener('click', () => aiModal.classList.add('hidden'));

    document.getElementById('startAiTrackBtn').addEventListener('click', async () => {
        if (!selectedItemId) return;
        const targetItem = project.items.find(i => i.id === selectedItemId);
        const mainVideo = project.items.find(i => i.type === 'video' && i.el);
        
        if (!mainVideo) { alert("トラッキング対象となる背景動画を追加してください"); return; }

        const progressArea = document.getElementById('aiProgressArea');
        const statusText = document.getElementById('aiStatusText');
        const progressBar = document.getElementById('aiProgressBar');
        
        progressArea.classList.remove('hidden');
        statusText.innerText = "🧠 AIモデル（DETR）をロード中...";
        progressBar.style.width = "10%";

        try {
            if (!detectorPipeline) {
                detectorPipeline = await pipeline('object-detection', 'Xenova/detr-resnet-50');
            }

            statusText.innerText = "🔍 映像フレームを解析・トラッキング中...";
            const videoEl = mainVideo.el;
            const step = 0.5; // 0.5秒おきにキーフレーム追加
            const newKeyframes = [];
            const category = document.getElementById('aiTargetCategory').value;

            for (let t = targetItem.start; t <= targetItem.start + targetItem.duration; t += step) {
                videoEl.currentTime = t - mainVideo.start;
                await new Promise(r => setTimeout(r, 100)); // フレームロード待ち

                // 裏Canvasにフレームを描画してAI判定
                offCanvas.width = 640; offCanvas.height = 360;
                offCtx.drawImage(videoEl, 0, 0, 640, 360);
                
                const results = await detectorPipeline(offCanvas.toDataURL('image/jpeg'));
                let bestObj = null;

                if (category === 'person') {
                    bestObj = results.find(r => r.label === 'person' && r.score > 0.5);
                } else {
                    bestObj = results.sort((a,b) => (b.box.xmax - b.box.xmin)*(b.box.ymax - b.box.ymin) - (a.box.xmax - a.box.xmin)*(a.box.ymax - a.box.ymin))[0];
                }

                if (bestObj) {
                    // 640x360 から 1920x1080 座標へ変換
                    const centerX = ((bestObj.box.xmin + bestObj.box.xmax) / 2 / 640) * 1920;
                    const centerY = ((bestObj.box.ymin + bestObj.box.ymax) / 2 / 360) * 1080;
                    newKeyframes.push({ time: t - targetItem.start, x: centerX, y: centerY, scale: 1.0, opacity: 1.0 });
                }

                const progress = Math.min(100, Math.round(((t - targetItem.start) / targetItem.duration) * 100));
                progressBar.style.width = `${progress}%`;
            }

            if (newKeyframes.length > 0) {
                targetItem.keyframes = newKeyframes;
                updateTimeline();
                alert(`🎯 トラッキング成功！ ${newKeyframes.length} 個のキーフレームを自動配置しました。`);
            } else {
                alert("⚠️ 対象物を特定できませんでした。別のモードをお試しください。");
            }
        } catch (e) {
            console.error(e);
            alert("⚠️ AIトラッキング中にエラーが発生しました");
        } finally {
            progressArea.classList.add('hidden');
            aiModal.classList.add('hidden');
        }
    });

    function splitSelectedItem() {
        if(!selectedItemId) return;
        const item = project.items.find(i => i.id === selectedItemId);
        const localTime = currentTime - item.start;
        if(localTime <= 0.1 || localTime >= item.duration - 0.1) return;
        
        const origDuration = item.duration;
        item.duration = localTime; 
        
        const newItem = JSON.parse(JSON.stringify(item));
        newItem.id = generateId(); newItem.start = currentTime; newItem.duration = origDuration - localTime;
        newItem.keyframes = [{ time: 0, x: newItem.keyframes[0]?.x || 960, y: newItem.keyframes[0]?.y || 540, scale: 1.0, opacity: 1.0 }];

        if(item.el) {
            const el = document.createElement(item.el.tagName);
            el.src = item.src; el.crossOrigin = "anonymous"; el.muted = item.muted;
            newItem.el = el;
        }
        
        project.items.push(newItem); selectItem(newItem.id); updateTimeline();
        ui.statusMsg.innerText = "✂️ カットしました"; ui.statusMsg.classList.remove('hidden'); setTimeout(() => ui.statusMsg.classList.add('hidden'), 1500);
    }
    document.getElementById('splitBtn').addEventListener('click', splitSelectedItem);
    window.addEventListener('keydown', (e) => { if ((e.key === 's' || e.key === 'S') && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') splitSelectedItem(); });

    function getInterpolatedProps(item, localTime) {
        if (!item.keyframes || item.keyframes.length === 0) return { x: 960, y: 540, scale: 1, opacity: 1 };
        if (item.keyframes.length === 1) return JSON.parse(JSON.stringify(item.keyframes[0]));
        const kfs = [...item.keyframes].sort((a, b) => a.time - b.time);
        if (localTime <= kfs[0].time) return JSON.parse(JSON.stringify(kfs[0]));
        if (localTime >= kfs[kfs.length - 1].time) return JSON.parse(JSON.stringify(kfs[kfs.length - 1]));
        let prev = kfs[0], next = kfs[1];
        for (let i = 0; i < kfs.length - 1; i++) { if (localTime >= kfs[i].time && localTime <= kfs[i+1].time) { prev = kfs[i]; next = kfs[i+1]; break; } }
        const ratio = (localTime - prev.time) / (next.time - prev.time);
        return { x: prev.x + (next.x - prev.x) * ratio, y: prev.y + (next.y - prev.y) * ratio, scale: prev.scale + (next.scale - prev.scale) * ratio, opacity: prev.opacity + (next.opacity - prev.opacity) * ratio };
    }

    function drawChromaElement(el, w, h, targetColorHex, tol) {
        offCanvas.width = w; offCanvas.height = h;
        offCtx.drawImage(el, 0, 0, w, h);
        const imgData = offCtx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const targetRgb = hexToRgb(targetColorHex);
        
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            const dist = Math.sqrt(Math.pow(r - targetRgb[0], 2) + Math.pow(g - targetRgb[1], 2) + Math.pow(b - targetRgb[2], 2));
            if (dist < tol) { data[i+3] = 0; }
        }
        offCtx.putImageData(imgData, 0, 0);
        return offCanvas;
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const drawOrder = ['video', 'pip', 'text'];
        
        drawOrder.forEach(type => {
            const activeItems = project.items.filter(item => item.type === type && currentTime >= item.start && currentTime <= (item.start + item.duration));
            activeItems.forEach(item => {
                const localTime = currentTime - item.start;
                const props = getInterpolatedProps(item, localTime);
                
                if (item.anim === 'fade' && localTime < 0.5) props.opacity *= (localTime / 0.5);
                else if (item.anim === 'slide-up' && localTime < 0.5) { props.opacity *= (localTime / 0.5); props.y += (0.5 - localTime) * 200; }
                else if (item.anim === 'zoom-in' && localTime < 0.5) { props.opacity *= (localTime / 0.5); props.scale *= (0.5 + localTime); }
                
                ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, props.opacity));
                if (item.id === selectedItemId && !isExporting) { ctx.shadowColor = '#58a6ff'; ctx.shadowBlur = 20; }

                if (type === 'video' || type === 'pip') {
                    if (item.el && (item.el.readyState >= 2 || item.el.complete)) {
                        if (item.el.tagName === 'VIDEO') {
                            item.el.muted = item.muted;
                            if (!isPlaying && Math.abs(item.el.currentTime - localTime) > 0.15) {
                                item.el.currentTime = localTime;
                            }
                        }
                        
                        const vw = item.el.videoWidth || item.el.naturalWidth || 400;
                        const vh = item.el.videoHeight || item.el.naturalHeight || 225;
                        const sourceEl = item.chroma ? drawChromaElement(item.el, vw, vh, item.chromaColor, item.chromaTol) : item.el;

                        if(type === 'video') { 
                            ctx.drawImage(sourceEl, 0, 0, canvas.width, canvas.height); 
                        } 
                        else {
                            const w = vw * props.scale; const h = vh * props.scale;
                            ctx.translate(props.x, props.y); 
                            ctx.drawImage(sourceEl, -(w*0.3)/2, -(h*0.3)/2, w*0.3, h*0.3);
                        }
                    }
                } else if (type === 'text') {
                    ctx.translate(props.x, props.y); ctx.scale(props.scale, props.scale);
                    ctx.font = `900 ${item.size}px sans-serif`; ctx.fillStyle = item.color; ctx.strokeStyle = '#000';
                    ctx.lineWidth = item.size * 0.1; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
                    ctx.strokeText(item.text, 0, 0); ctx.shadowBlur = 0; ctx.fillText(item.text, 0, 0);
                }
                ctx.restore();
            });
        });

        const activeAudio = project.items.filter(item => item.type === 'audio' && currentTime >= item.start && currentTime <= (item.start + item.duration));
        activeAudio.forEach(item => {
            const localTime = currentTime - item.start;
            if(item.el && !isPlaying && Math.abs(item.el.currentTime - localTime) > 0.15) {
                item.el.currentTime = localTime;
            }
        });

        if (!isExporting) {
            ui.timeDisplay.innerText = `${currentTime.toFixed(1)} / ${project.duration.toFixed(1)}`;
            ui.seekSlider.value = (currentTime / project.duration) * 100;
            ui.playhead.style.left = `${ui.seekSlider.value}%`;
            
            if (selectedItemId) {
                const item = project.items.find(i => i.id === selectedItemId);
                if(item) {
                    const props = getInterpolatedProps(item, currentTime - item.start);
                    document.getElementById('propStart').value = item.start.toFixed(2);
                    document.getElementById('propDuration').value = item.duration.toFixed(2);
                    document.getElementById('propX').value = Math.round(props.x);
                    document.getElementById('propY').value = Math.round(props.y);
                    document.getElementById('propScale').value = props.scale.toFixed(2);
                    document.getElementById('propOpacity').value = props.opacity.toFixed(2);
                }
            }
        }

        if (isPlaying && !isExporting) {
            const now = performance.now(); const delta = (now - lastTimeUpdate) / 1000;
            currentTime += delta; lastTimeUpdate = now;
            if (currentTime >= project.duration) { currentTime = project.duration; togglePlay(false); }
        }
        requestAnimationFrame(render);
    }
    render();

    function togglePlay(force) {
        isPlaying = force !== undefined ? force : !isPlaying;
        ui.playBtn.innerText = isPlaying ? '⏸ 停止' : '▶ 再生';
        ui.playBtn.className = isPlaying ? 'bg-[#d73a49] text-white px-4 py-1 rounded font-bold w-24' : 'bg-[#238636] hover:bg-[#2ea043] text-white px-4 py-1 rounded font-bold w-24';
        lastTimeUpdate = performance.now();
        project.items.forEach(item => {
            if (item.el && item.el.tagName !== 'IMG') {
                if (isPlaying && currentTime >= item.start && currentTime <= (item.start + item.duration)) {
                    item.el.currentTime = currentTime - item.start;
                    item.el.play().catch(()=>{});
                } else { item.el.pause(); }
            }
        });
    }

    ui.playBtn.addEventListener('click', () => togglePlay());
    
    let tlDraggingItem = null;
    let tlDragAction = null;
    let tlDragStartX = 0;
    let tlOriginalStart = 0;
    let tlOriginalDuration = 0;
    let isPlayheadDragging = false;

    ui.playheadHandle.addEventListener('mousedown', (e) => {
        isPlayheadDragging = true;
        e.stopPropagation();
    });

    ui.tlTracks.addEventListener('mousedown', (e) => {
        const itemEl = e.target.closest('.timeline-item');
        if (itemEl) {
            const itemId = itemEl.getAttribute('data-id');
            selectItem(itemId);
            
            tlDraggingItem = project.items.find(i => i.id === itemId);
            if (!tlDraggingItem) return;

            tlDragStartX = e.clientX;
            tlOriginalStart = tlDraggingItem.start;
            tlOriginalDuration = tlDraggingItem.duration;

            if (e.target.classList.contains('resize-handle-l')) tlDragAction = 'resize-l';
            else if (e.target.classList.contains('resize-handle-r')) tlDragAction = 'resize-r';
            else tlDragAction = 'move';
            
            e.stopPropagation();
            return;
        }
        seekByMouse(e);
    });

    window.addEventListener('mousemove', (e) => {
        if (isPlayheadDragging) {
            seekByMouse(e);
            return;
        }

        if (!tlDraggingItem) return;
        const rect = ui.tlTracks.getBoundingClientRect();
        const pxToTime = project.duration / rect.width;
        const timeDiff = (e.clientX - tlDragStartX) * pxToTime;

        if (tlDragAction === 'move') {
            let newStart = tlOriginalStart + timeDiff;
            if (newStart < 0) newStart = 0;
            tlDraggingItem.start = newStart;
        } 
        else if (tlDragAction === 'resize-l') {
            let newStart = tlOriginalStart + timeDiff;
            let newDuration = tlOriginalDuration - timeDiff;
            if (newDuration < 0.1) { newDuration = 0.1; newStart = tlOriginalStart + tlOriginalDuration - 0.1; }
            if (newStart < 0) { newStart = 0; newDuration = tlOriginalStart + tlOriginalDuration; }
            tlDraggingItem.start = newStart;
            tlDraggingItem.duration = newDuration;
        } 
        else if (tlDragAction === 'resize-r') {
            let newDuration = tlOriginalDuration + timeDiff;
            if (newDuration < 0.1) newDuration = 0.1;
            tlDraggingItem.duration = newDuration;
        }

        updateTimeline();
        document.getElementById('propStart').value = tlDraggingItem.start.toFixed(2);
        document.getElementById('propDuration').value = tlDraggingItem.duration.toFixed(2);
    });

    window.addEventListener('mouseup', () => { 
        tlDraggingItem = null; 
        tlDragAction = null; 
        isPlayheadDragging = false; 
    });

    function seekByMouse(e) {
        const rect = ui.tlTracks.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        currentTime = Math.max(0, Math.min(1, clickX / rect.width)) * project.duration;
        project.items.forEach(item => {
            if (item.el && item.el.tagName !== 'IMG' && currentTime >= item.start && currentTime <= (item.start + item.duration)) {
                item.el.currentTime = currentTime - item.start;
            }
        });
    }

    ui.zoomSlider.addEventListener('input', (e) => { ui.tlContent.style.width = `${e.target.value * 100}%`; });
    document.getElementById('addTextBtn').addEventListener('click', () => addItem('text', null, null));
    document.getElementById('mediaUpload').addEventListener('change', (e) => { const f = e.target.files[0]; if(f) addItem(f.type.startsWith('video') ? 'video' : 'audio', URL.createObjectURL(f), f); e.target.value = ''; });
    document.getElementById('pipUpload').addEventListener('change', (e) => { const f = e.target.files[0]; if(f) addItem('pip', URL.createObjectURL(f), f); e.target.value = ''; });

    function updateTimeline() {
        ['video', 'pip', 'text', 'audio'].forEach(trackType => {
            const container = document.getElementById(`track-${trackType}`); container.innerHTML = '';
            project.items.filter(i => i.type === trackType).forEach(item => {
                const el = document.createElement('div');
                el.className = `timeline-item track-${trackType} ${item.id === selectedItemId ? 'item-selected' : ''}`;
                el.style.left = `${(item.start / project.duration) * 100}%`;
                el.style.width = `${(item.duration / project.duration) * 100}%`;
                el.setAttribute('data-id', item.id);

                const handleL = document.createElement('div'); handleL.className = 'resize-handle-l'; el.appendChild(handleL);
                const handleR = document.createElement('div'); handleR.className = 'resize-handle-r'; el.appendChild(handleR);
                
                const textSpan = document.createElement('span'); textSpan.style.pointerEvents = 'none';
                let label = item.type === 'text' ? item.text : `${item.type.toUpperCase()}`;
                if(item.chroma) label += ' 🎨';
                if(item.muted) label += ' 🔇';
                textSpan.innerText = label;
                el.appendChild(textSpan);

                if(item.keyframes) {
                    item.keyframes.forEach(kf => {
                        const m = document.createElement('div'); m.className = 'kf-marker'; m.style.left = `${(kf.time / item.duration) * 100}%`; el.appendChild(m);
                    });
                }
                container.appendChild(el);
            });
        });
    }

    function selectItem(id) {
        selectedItemId = id; updateTimeline();
        const item = project.items.find(i => i.id === id);
        if (item) {
            ui.propsPanel.classList.remove('opacity-50', 'pointer-events-none');
            
            const detachBtn = document.getElementById('detachAudioBtn');
            if (item.type === 'video' && !item.muted) detachBtn.classList.remove('hidden');
            else detachBtn.classList.add('hidden');

            // ★ AIトラッキングボタン（テキストまたはPiPの時だけ表示）
            const aiTrackBtn = document.getElementById('aiTrackBtn');
            if (item.type === 'text' || item.type === 'pip') aiTrackBtn.classList.remove('hidden');
            else aiTrackBtn.classList.add('hidden');

            const chromaArea = document.getElementById('chromaArea');
            const chromaControls = document.getElementById('chromaControls');
            if (item.type === 'video' || item.type === 'pip') {
                chromaArea.classList.remove('hidden');
                document.getElementById('propChromaEnable').checked = item.chroma || false;
                document.getElementById('propChromaColor').value = item.chromaColor || '#00ff00';
                document.getElementById('propChromaTol').value = item.chromaTol || 100;
                document.getElementById('chromaVal').innerText = item.chromaTol || 100;
                if(item.chroma) chromaControls.classList.remove('hidden'); else chromaControls.classList.add('hidden');
            } else { chromaArea.classList.add('hidden'); }

            if(item.type === 'text') {
                document.getElementById('propTextArea').classList.remove('hidden'); document.getElementById('propText').value = item.text;
                document.getElementById('propColor').value = item.color; document.getElementById('propSize').value = item.size;
            } else { document.getElementById('propTextArea').classList.add('hidden'); }
        } else { 
            ui.propsPanel.classList.add('opacity-50', 'pointer-events-none'); 
            document.getElementById('detachAudioBtn').classList.add('hidden');
            document.getElementById('aiTrackBtn').classList.add('hidden');
            document.getElementById('chromaArea').classList.add('hidden');
        }
    }

    document.getElementById('propChromaEnable').addEventListener('change', (e) => {
        if(!selectedItemId) return;
        const item = project.items.find(i => i.id === selectedItemId);
        item.chroma = e.target.checked;
        if(item.chroma) document.getElementById('chromaControls').classList.remove('hidden');
        else document.getElementById('chromaControls').classList.add('hidden');
        updateTimeline();
    });

    document.getElementById('propChromaColor').addEventListener('input', (e) => {
        if(!selectedItemId) return;
        const item = project.items.find(i => i.id === selectedItemId);
        item.chromaColor = e.target.value;
    });

    document.getElementById('propChromaTol').addEventListener('input', (e) => {
        if(!selectedItemId) return;
        const item = project.items.find(i => i.id === selectedItemId);
        item.chromaTol = parseInt(e.target.value);
        document.getElementById('chromaVal').innerText = item.chromaTol;
    });

    ['propStart', 'propDuration', 'propText', 'propColor', 'propSize', 'propAnim'].forEach(id => {
        document.getElementById(id).addEventListener('input', (e) => {
            if(!selectedItemId) return; const item = project.items.find(i => i.id === selectedItemId); const key = id.replace('prop', '').toLowerCase();
            if(key === 'text' || key === 'color' || key === 'anim') item[key] = e.target.value; else item[key] = parseFloat(e.target.value);
            updateTimeline();
        });
    });

    document.getElementById('addKfBtn').addEventListener('click', () => {
        if(!selectedItemId) return; const item = project.items.find(i => i.id === selectedItemId); const localTime = currentTime - item.start;
        if(localTime < 0 || localTime > item.duration) return alert("範囲外です");
        const x = parseFloat(document.getElementById('propX').value); const y = parseFloat(document.getElementById('propY').value);
        const existingIdx = item.keyframes.findIndex(k => Math.abs(k.time - localTime) < 0.1);
        const data = { time: localTime, x, y, scale: parseFloat(document.getElementById('propScale').value), opacity: parseFloat(document.getElementById('propOpacity').value) };
        if(existingIdx >= 0) item.keyframes[existingIdx] = data; else item.keyframes.push(data);
        updateTimeline(); document.getElementById('addKfBtn').innerText = "✅"; setTimeout(() => document.getElementById('addKfBtn').innerText = "🔷 現在位置に打鍵", 1000);
    });

    document.getElementById('deleteItemBtn').addEventListener('click', () => { project.items = project.items.filter(i => i.id !== selectedItemId); selectItem(null); updateTimeline(); });

</script>
</body>
